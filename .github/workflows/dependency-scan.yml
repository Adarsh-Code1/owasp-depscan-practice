name: OWASP Dependency Scan

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-scan:
    name: Scan dependencies
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare report directory
        run: mkdir -p reports

      - name: Run OWASP dep-scan
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/app" \
            -v "$RUNNER_TEMP/dep-scan-vdb:/db" \
            -e VDB_HOME=/db \
            ghcr.io/owasp-dep-scan/dep-scan \
            depscan --src /app --reports-dir /tmp/reports

      - name: Upload security report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owasp-depscan-report
          path: reports/
          if-no-files-found: warn
          retention-days: 7
