      - name: Run OWASP dep-scan
        run: |
          mkdir -p reports "$RUNNER_TEMP/dep-scan-vdb"

          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e VDB_HOME=/db \
            -v "$RUNNER_TEMP/dep-scan-vdb:/db" \
            -v "$GITHUB_WORKSPACE:/app" \
            ghcr.io/owasp-dep-scan/dep-scan \
            depscan-vdb download --scope app

          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e VDB_HOME=/db \
            -v "$RUNNER_TEMP/dep-scan-vdb:/db" \
            -v "$GITHUB_WORKSPACE:/app" \
            ghcr.io/owasp-dep-scan/dep-scan \
            depscan --src /app --reports-dir /app/reports
